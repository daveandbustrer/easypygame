[build-system]
requires = ["setuptools>=68", "setuptools_scm"]
build-backend = "setuptools.build_meta"

[project]
name = "blu-easypygame"
dynamic = ["version"]
authors = [
  { name = "Praneel Shanmugam", email = "praneelcatchu@gmail.com" },
]
description = "An easier way to use pygame"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }

classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools_scm]
write_to = "src/Blu_easypygame/_version.py"
local_scheme = "no-local-version"
