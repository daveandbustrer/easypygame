[build-system]
requires = ["hatchling >= 1.26"]
build-backend = "hatchling.build"
[project]
name = "Blu_easy_pygame"
version = "0.0.1"
authors = [
  { name="Praneel Shanmugam", email="praneelcatchu@gmail.com" },
]
description = "a easier way to use pygames"
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
license = "MIT"
license-files = ["LICEN[CS]E*"]